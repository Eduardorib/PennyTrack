[project]
name = "penny-track"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eduardorib", email = "eduardoribeirogon@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
penny-track = "penny_track:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
